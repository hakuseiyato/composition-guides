<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Composition Guides</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <!-- 基準シーケンス -->
    <section class="panel"><h2>基準シーケンス</h2><div class="row" id="seqInfo">アクティブシーケンス</div></section>

    <!-- 動的にセクションを差し込む -->
    <div id="sections"></div>

    <!-- 操作ボタン（固定フッタ） -->
    <footer id="actions">
      <button id="btnClear" class="secondary">全消去</button>
      <button id="btnToggle" class="secondary">表示切替</button>
      <button id="btnGenerate" class="primary">生成 / 更新</button>
    </footer>
    <div id="status" class="status"></div>

    <!-- ガイド PNG の描画先（非表示） -->
    <canvas id="cgCanvas" style="display:none"></canvas>
  </div>

  <script src="js/engine.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
